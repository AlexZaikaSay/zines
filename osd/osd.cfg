# OSD CPU memory map (placeholder until the hardware map is fixed).
# Flat 64K image like tests/asm/6502.cfg: every area is written to the
# output at its address, unused space filled with $FF.
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0800;   # C software stack, 2K
}
MEMORY {
    ZP:          start = $0000, size = $0100, type = rw, fill = yes, fillval = $FF, file = %O, define = yes;
    HWSTACK:     start = $0100, size = $0100, type = rw, fill = yes, fillval = $FF, file = %O;
    RAM:         start = $0200, size = $7E00, type = rw, fill = yes, fillval = $FF, file = %O, define = yes;
    ROM:         start = $8000, size = $7FFA, type = ro, fill = yes, fillval = $FF, file = %O;
    ROM_VECTORS: start = $FFFA, size = $0006, type = ro, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,          type = zp;
    DATA:     load = RAM,         type = rw;
    BSS:      load = RAM,         type = bss, define = yes;
    STARTUP:  load = ROM,         type = ro;
    ONCE:     load = ROM,         type = ro,  optional = yes;
    CODE:     load = ROM,         type = ro;
    RODATA:   load = ROM,         type = ro;
    VECTORS:  load = ROM_VECTORS, type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
