# OSD CPU memory map (placeholder until the hardware map is fixed).
# The output image is only the 32K ROM at $8000-$FFFF (padded with $FF);
# RAM areas are not written (file = ""). Initialized DATA is stored in ROM
# and copied to RAM by crt0 (copydata). RAM ends at $1FFF to match the
# board decode ($0000-$1FFF); the C stack grows down from $2000.
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0800;   # C software stack, 2K
}
MEMORY {
    ZP:          start = $0000, size = $0100, type = rw, file = "", define = yes;
    HWSTACK:     start = $0100, size = $0100, type = rw, file = "";
    RAM:         start = $0200, size = $1E00, type = rw, file = "", define = yes;
    ROM:         start = $8000, size = $7FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM_VECTORS: start = $FFFA, size = $0006, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,          type = zp;
    STARTUP:  load = ROM,         type = ro;
    ONCE:     load = ROM,         type = ro,  optional = yes;
    CODE:     load = ROM,         type = ro;
    RODATA:   load = ROM,         type = ro;
    DATA:     load = ROM, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,         type = bss, define = yes;
    VECTORS:  load = ROM_VECTORS, type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
