# Supervisor (OSD CPU) test programs: the image is only the 32K ROM at $8000-$FFFF,
# as sync_rom loads it. RAM ($0000-$1FFF) is not part of the file.
MEMORY {
    ZP:          start = $0000, size = $0100, type = rw, file = "";
    RAM:         start = $0200, size = $1E00, type = rw, file = "";
    ROM:         start = $8000, size = $7FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM_VECTORS: start = $FFFA, size = $0006, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,          type = zp,  optional = yes;
    BSS:      load = RAM,         type = bss, optional = yes;
    CODE:     load = ROM,         type = ro;
    VECTORS:  load = ROM_VECTORS, type = ro;
}
